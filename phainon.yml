# Phainon Distribution Center Client Configuration
# 刻法勒永志不忘。
name: "ClassPixelPro"
components:
  app:
    allowDiffUpdate: true
    root: "app-$(version)-$(number)/"
    includes:
      - "**"
  launcher:
    root: ""
    includes:
      - "**"
    excludes:
      - "app*/**"
      - "files.json"
variables:
  number: 0
fileRepoRoot: "https://class.imzcz.cn/api/dist/repo/"
archiveRoot: "https://class.imzcz.cn/api/dist/archives/$(primaryVersion)/$(version)/"
bucketKeyRoot: "classpixelpro/distribution-v2/repo/"
archiveBucketKeyRoot: "classpixelpro/distribution-v2/$(primaryVersion)/$(version)/"
appChangeLogPath: "$(thisFileDir)/doc/ChangeLogs/$(primaryVersion)/$(version)/App.md"
appChangeLogTemplate: |
  $(changeLog)

  ---

  ## 校验和与下载链接

  > [!tip]
  > 内地用户建议前往[ClassPixelPro 官网](https://class.imzcz.cn/#/download)，或通过下方表格中的高速下载链接下载 ClassPixelPro，以获得更好的下载体验。

  > [!important]
  > 下载时请注意核对文件 SHA512 是否正确。

  $(hashes)