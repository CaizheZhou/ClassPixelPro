name: Release

on:
  push:
    tags:
      - '2.*'
  workflow_dispatch:
    inputs:
      release_tag:
        description: '要发布的 tag（如 2.1.2.3）'
        required: true
        type: string

permissions:
  contents: write

jobs:
  build:
    name: Build_and_Pack
    runs-on: windows-2022
    env:
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.release_tag || github.ref_name }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive
          ref: ${{ github.event_name == 'workflow_dispatch' && format('refs/tags/{0}', github.event.inputs.release_tag) || github.ref }}

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x

      - name: Build and assemble dist package (pack.ps1)
        shell: pwsh
        run: pwsh -File ./pack.ps1 -Version $env:RELEASE_TAG -DistDir ci-dist

      - name: Collect zip into workspace
        shell: pwsh
        run: |
          Move-Item "../ClassPixelPro_$($env:RELEASE_TAG)_windows-x64.zip" ./ -Force
          Get-ChildItem *.zip

      - name: Upload release artifact
        uses: actions/upload-artifact@v4
        with:
          name: release_package
          path: ./ClassPixelPro_${{ env.RELEASE_TAG }}_windows-x64.zip
          if-no-files-found: error
        continue-on-error: true

      - name: Generate release notes
        shell: pwsh
        env:
          RELEASE_TAG: ${{ env.RELEASE_TAG }}
        run: |
          $ErrorActionPreference = 'Stop'
          $tag = $env:RELEASE_TAG
          $changelogPath = 'CHANGELOG.md'
          $notes = "ClassPixelPro $tag"
          if (Test-Path $changelogPath) {
            $content = Get-Content $changelogPath -Raw -Encoding UTF8
            $pattern = "## \[$([regex]::Escape($tag))\][^\r\n]*\r?\n([\s\S]*?)(?=\r?\n## \[|\Z)"
            $m = [regex]::Match($content, $pattern)
            if ($m.Success) { $notes = $m.Groups[1].Value.Trim() }
          }
          $sb = [System.Text.StringBuilder]::new($notes)
          [void]$sb.AppendLine()
          [void]$sb.AppendLine()
          [void]$sb.AppendLine("## 校验和与下载链接")
          [void]$sb.AppendLine()
          [void]$sb.AppendLine("**下载时请注意核对文件 SHA512 是否正确。**")
          [void]$sb.AppendLine()
          [void]$sb.AppendLine("| 文件名 | SHA512 |")
          [void]$sb.AppendLine("|--------|--------|")
          Get-ChildItem ./*.zip | ForEach-Object {
            $sha = (Get-FileHash $_.FullName -Algorithm SHA512).Hash.ToUpper()
            [void]$sb.AppendLine("| $($_.Name) | $sha |")
          }
          $sb.ToString() | Set-Content -Path release_notes.md -Encoding UTF8
          Write-Host "===== Generated release notes ====="
          Get-Content release_notes.md -Raw
          Write-Host "=================================="

      - name: Create GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ env.RELEASE_TAG }}
        run: |
          $ErrorActionPreference = 'Stop'
          $tag = $env:RELEASE_TAG
          $zips = (Get-ChildItem ./*.zip).FullName
          if (gh release view $tag --repo $env:GH_REPO 2>$null) {
            Write-Host "Release $tag already exists, deleting and recreating"
            gh release delete $tag --repo $env:GH_REPO --yes
          }
          gh release create $tag $zips --repo $env:GH_REPO `
            --title "ClassPixelPro $tag" `
            --notes-file release_notes.md `
            --latest
