name: Release

on:
  push:
    tags:
      - '2.*'
  workflow_dispatch:
    inputs:
      release_tag:
        description: '要发布的 tag（如 2.1.2.3）'
        required: true
        type: string

permissions:
  contents: write

jobs:
  build:
    name: Build_and_Pack
    runs-on: windows-2022
    env:
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.release_tag || github.ref_name }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive
          ref: ${{ github.event_name == 'workflow_dispatch' && format('refs/tags/{0}', github.event.inputs.release_tag) || github.ref }}

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x

      - name: Build and assemble dist package (pack.ps1)
        shell: pwsh
        run: pwsh -File ./pack.ps1 -Version $env:RELEASE_TAG -DistDir ci-dist

      - name: Collect zip into workspace
        shell: pwsh
        run: |
          Move-Item "../ClassPixelPro_$($env:RELEASE_TAG)_windows-x64.zip" ./ -Force
          Get-ChildItem *.zip

      - name: Upload release artifact
        uses: actions/upload-artifact@v4
        with:
          name: release_package
          path: ./ClassPixelPro_${{ env.RELEASE_TAG }}_windows-x64.zip
          if-no-files-found: error

  publish:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Download release artifact
        uses: actions/download-artifact@v4
        with:
          path: ./rel
          pattern: release_package
          merge-multiple: true

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.release_tag || github.ref_name }}
        run: |
          gh release create "$RELEASE_TAG" ./rel/*.zip \
            --title "ClassPixelPro $RELEASE_TAG" \
            --generate-notes \
            --latest
